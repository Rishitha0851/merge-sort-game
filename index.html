<!DOCTYPE html>
<html>
<head>
  <title>Merge Sort Game</title>

  <style>
    body{
      background:#111;
      color:white;
      text-align:center;
      font-family:Arial;
    }

    h1{
      margin-top:20px;
    }

    button{
      padding:10px 20px;
      margin:10px;
      border:none;
      border-radius:5px;
      background:orange;
      color:white;
      cursor:pointer;
    }

    #array{
      display:flex;
      justify-content:center;
      align-items:flex-end;
      height:400px;
      margin-top:40px;
    }

    .bar{
      width:30px;
      margin:2px;
      background:cyan;
    }
  </style>
</head>

<body>

<h1>Merge Sort Visualizer</h1>

<button onclick="generateArray()">Generate Array</button>
<button onclick="startSort()">Start Merge Sort</button>

<div id="array"></div>

<script>

let arr=[];

function generateArray(){

  arr=[];

  const container=document.getElementById("array");

  container.innerHTML="";

  for(let i=0;i<15;i++){

    let value=Math.floor(Math.random()*300)+20;

    arr.push(value);

    const bar=document.createElement("div");

    bar.classList.add("bar");

    bar.style.height=value+"px";

    container.appendChild(bar);
  }
}

async function startSort(){

  await mergeSort(arr,0,arr.length-1);
}

async function mergeSort(arr,left,right){

  if(left>=right) return;

  let mid=Math.floor((left+right)/2);

  await mergeSort(arr,left,mid);

  await mergeSort(arr,mid+1,right);

  await merge(arr,left,mid,right);
}

async function merge(arr,left,mid,right){

  let temp=[];

  let i=left;

  let j=mid+1;

  while(i<=mid && j<=right){

    if(arr[i]<arr[j]){

      temp.push(arr[i]);

      i++;

    }else{

      temp.push(arr[j]);

      j++;
    }
  }

  while(i<=mid){

    temp.push(arr[i]);

    i++;
  }

  while(j<=right){

    temp.push(arr[j]);

    j++;
  }

  for(let k=left;k<=right;k++){

    arr[k]=temp[k-left];

    const bars=document.getElementsByClassName("bar");

    bars[k].style.height=arr[k]+"px";

    bars[k].style.background="red";

    await sleep(200);

    bars[k].style.background="cyan";
  }
}

function sleep(ms){

  return new Promise(resolve=>setTimeout(resolve,ms));
}

generateArray();

</script>

</body>
</html>
